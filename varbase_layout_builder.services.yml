services:
  varbase_layout_builder.negotiator.ajax_base_page:
    class: Drupal\varbase_layout_builder\Theme\VarbaseLayoutBuilderThemeNegotiator
    arguments:
      ["@csrf_token", "@config.factory", "@request_stack", "@theme_handler"]
    tags:
      - { name: theme_negotiator, priority: 5000 }
  # Drupal 10 does not discover hook classes, so register it here.
  Drupal\varbase_layout_builder\Hook\EditorLanguageHooks:
    class: Drupal\varbase_layout_builder\Hook\EditorLanguageHooks
    arguments:
      ['@language_manager', '@current_route_match', '@?Drupal\ckeditor5\LanguageMapper']
