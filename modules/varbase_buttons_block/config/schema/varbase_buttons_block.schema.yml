# Schema for the configuration files of the Varbase Buttons Block module.

varbase_buttons_block.settings:
  type: config_object
  label: 'Varbase Buttons Block settings'
  mapping:
    colors:
      type: mapping
      label: 'Button colors'
    sizes:
      type: mapping
      label: 'Button sizes'
    default:
      type: mapping
      label: 'Default settings'
      mapping:
        color:
          type: string
          label: 'Default color'
        size:
          type: string
          label: 'Default size'
        outline:
          type: integer
          label: 'Outline'
        target:
          type: integer
          label: 'Target'
        block_level:
          type: integer
          label: 'Block level'
        disabled:
          type: integer
          label: 'Disabled'
    override_color:
      type: integer
      label: 'Override color'
    override_size:
      type: integer
      label: 'Override size'
    override_outline:
      type: integer
      label: 'Override outline'
    override_target:
      type: integer
      label: 'Override target'
    override_block_level:
      type: integer
      label: 'Override block level'
    override_disabled:
      type: integer
      label: 'Override disabled'
